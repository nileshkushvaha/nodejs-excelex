services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: excelex_owner
      POSTGRES_PASSWORD: dev_owner_password
      POSTGRES_DB: excelex
    ports:
      - "5432:5432"
    # PostgreSQL 18+ stores data in a major-version subdirectory, so the mount
    # goes at /var/lib/postgresql — NOT /var/lib/postgresql/data as in 17 and
    # earlier. Mounting the old path makes the container refuse to start.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excelex_owner -d excelex"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Database inspection UI. Development only — it is never part of a deployed
  # stack, and it connects with whichever role you type, so use excelex_app when
  # you want to see what a client request can actually reach.
  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Local mail: everything the API sends lands here, nothing leaves the
  # machine. SMTP on 1025, the inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  pgdata:
